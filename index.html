<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #c77dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #scoreboard {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
      font-size: 1rem;
      color: #aaa;
    }

    #scoreboard span {
      font-size: 1.4rem;
      font-weight: bold;
      color: #ffd93d;
    }

    #canvas-wrap {
      position: relative;
      display: inline-block;
      border-radius: 12px;
      padding: 3px;
      background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #c77dff, #ff6b6b);
    }

    canvas {
      border-radius: 10px;
      display: block;
    }

    #message {
      margin-top: 16px;
      font-size: 1rem;
      color: #aaa;
      min-height: 24px;
    }

    button {
      margin-top: 14px;
      padding: 10px 30px;
      font-size: 1rem;
      font-weight: bold;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #c77dff);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    button:hover { opacity: 0.85; }

    #overlay {
      display: none;
      position: absolute;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(10, 10, 10, 0.93);
      border-radius: 10px;
      top: 0; left: 0;
    }

    #overlay.show { display: flex; }

    #overlay h2 {
      font-size: 2rem;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #c77dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #overlay p { font-size: 1rem; color: #ccc; }

    #overlay .final-score {
      font-size: 3rem;
      font-weight: bold;
      color: #ffd93d;
    }

    #newBestMsg {
      font-size: 1rem;
      color: #6bcb77;
      display: none;
    }
  </style>
</head>
<body>

  <h1>🐍 SNAKE</h1>

  <div id="scoreboard">
    Score: <span id="score">0</span>
    &nbsp;&nbsp;
    Best: <span id="best">0</span>
  </div>

  <div id="canvas-wrap">
   <canvas id="gameCanvas"></canvas> 
    <div id="overlay">
      <h2>GAME OVER</h2>
      <p>Your score</p>
      <div class="final-score" id="finalScore">0</div>
      <p id="newBestMsg">🏆 New best score!</p>
      <button onclick="startGame()">Play Again</button>
    </div>
  </div>

  <p id="message">Press Start or any arrow key to play!</p>
  <button onclick="startGame()">Start Game</button>

  <script>
    const canvas     = document.getElementById('gameCanvas');
    const ctx        = canvas.getContext('2d');
    const scoreEl    = document.getElementById('score');
    const bestEl     = document.getElementById('best');
    const msgEl      = document.getElementById('message');
    const overlay    = document.getElementById('overlay');
    const finalScore = document.getElementById('finalScore');
    const newBestMsg = document.getElementById('newBestMsg');

   const CELL_SIZE = 20;
const size = Math.min(window.innerWidth - 40, 400); // max 400px, fits mobile
canvas.width  = size;
canvas.height = size;
const COLS = Math.floor(canvas.width  / CELL_SIZE);
const ROWS = Math.floor(canvas.height / CELL_SIZE);

    // Every segment of the snake gets its own colour from this rainbow
    const RAINBOW = [
      '#ff6b6b', '#ff8e53', '#ffd93d',
      '#6bcb77', '#4d96ff', '#c77dff', '#ff6b9d'
    ];

    const FOOD_COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff8e53','#ff6b9d'];

    let snake, direction, nextDir, food, foodColor;
    let score, best = 0, gameLoop, isRunning = false;
    let pulse = 0, pulseGrowing = true;
    let rainbowOffset = 0;  // shifts the rainbow along the snake over time

    // ── Background: dark with faint coloured dots ──
    function drawBackground() {
      ctx.fillStyle = '#0d0d0d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Faint rainbow grid lines
      for (let c = 0; c <= COLS; c++) {
        ctx.strokeStyle = `hsl(${(c / COLS) * 360}, 60%, 18%)`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(c * CELL_SIZE, 0);
        ctx.lineTo(c * CELL_SIZE, canvas.height);
        ctx.stroke();
      }
      for (let r = 0; r <= ROWS; r++) {
        ctx.strokeStyle = `hsl(${(r / ROWS) * 360}, 60%, 18%)`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(0, r * CELL_SIZE);
        ctx.lineTo(canvas.width, r * CELL_SIZE);
        ctx.stroke();
      }
    }

    // ── Draw snake — each segment is a different rainbow colour ──
    function drawSnake() {
      snake.forEach((seg, index) => {
        // Shift hue along the snake + animate it over time with rainbowOffset
        const hue = (index * 25 + rainbowOffset) % 360;
        const color = `hsl(${hue}, 100%, 60%)`;

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(
          seg.x * CELL_SIZE + 1,
          seg.y * CELL_SIZE + 1,
          CELL_SIZE - 2,
          CELL_SIZE - 2,
          index === 0 ? 6 : 4
        );
        ctx.fill();

        // Eyes on the head
        if (index === 0) {
          const cx = seg.x * CELL_SIZE;
          const cy = seg.y * CELL_SIZE;

          let eye1, eye2;
          if      (direction.x === 1)  { eye1 = {x: cx+14, y: cy+5};  eye2 = {x: cx+14, y: cy+14}; }
          else if (direction.x === -1) { eye1 = {x: cx+5,  y: cy+5};  eye2 = {x: cx+5,  y: cy+14}; }
          else if (direction.y === -1) { eye1 = {x: cx+5,  y: cy+5};  eye2 = {x: cx+14, y: cy+5};  }
          else                         { eye1 = {x: cx+5,  y: cy+14}; eye2 = {x: cx+14, y: cy+14}; }

          ctx.fillStyle = 'white';
          ctx.beginPath(); ctx.arc(eye1.x, eye1.y, 3, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(eye2.x, eye2.y, 3, 0, Math.PI * 2); ctx.fill();

          ctx.fillStyle = '#111';
          ctx.beginPath(); ctx.arc(eye1.x, eye1.y, 1.5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(eye2.x, eye2.y, 1.5, 0, Math.PI * 2); ctx.fill();
        }
      });

      // Shift the rainbow animation forward each frame
      rainbowOffset = (rainbowOffset + 3) % 360;
    }

    // ── Pulsing food ──
    function drawFood() {
      if (pulseGrowing) { pulse += 0.15; if (pulse >= 2) pulseGrowing = false; }
      else              { pulse -= 0.15; if (pulse <= 0) pulseGrowing = true;  }

      const radius = (CELL_SIZE / 2 - 2) + pulse;
      const cx = food.x * CELL_SIZE + CELL_SIZE / 2;
      const cy = food.y * CELL_SIZE + CELL_SIZE / 2;

      // Glow ring
      ctx.fillStyle = foodColor + '55';
      ctx.beginPath();
      ctx.arc(cx, cy, radius + 4, 0, Math.PI * 2);
      ctx.fill();

      // Main dot
      ctx.fillStyle = foodColor;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();

      // Shine
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath();
      ctx.arc(cx - 3, cy - 3, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function placeFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
      foodColor = FOOD_COLORS[Math.floor(Math.random() * FOOD_COLORS.length)];
    }

    function tick() {
      direction = nextDir;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { endGame(); return; }
      if (snake.some(s => s.x === head.x && s.y === head.y))             { endGame(); return; }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }

      drawBackground();
      drawFood();
      drawSnake();
    }

    function startGame() {
      snake        = [{ x: 12, y: 10 }, { x: 11, y: 10 }, { x: 10, y: 10 }];
      direction    = { x: 1, y: 0 };
      nextDir      = { x: 1, y: 0 };
      score        = 0;
      pulse        = 0;
      pulseGrowing = true;
      rainbowOffset = 0;
      scoreEl.textContent = 0;
      msgEl.textContent   = '';
      isRunning = true;

      overlay.classList.remove('show');
      overlay.style.display = 'none';

      placeFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, 180);
    }

    function endGame() {
      clearInterval(gameLoop);
      isRunning = false;

      overlay.style.width  = canvas.width  + 'px';
      overlay.style.height = canvas.height + 'px';

      finalScore.textContent = score;

      if (score > best) {
        best = score;
        bestEl.textContent = best;
        newBestMsg.style.display = 'block';
      } else {
        newBestMsg.style.display = 'none';
      }

      overlay.classList.add('show');
    }

    document.addEventListener('keydown', function(event) {
      if (!isRunning) {
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)) {
          startGame(); return;
        }
      }
      if (event.key === 'ArrowUp'    && direction.y !== 1)  nextDir = { x: 0,  y: -1 };
      if (event.key === 'ArrowDown'  && direction.y !== -1) nextDir = { x: 0,  y:  1 };
      if (event.key === 'ArrowLeft'  && direction.x !== 1)  nextDir = { x: -1, y:  0 };
      if (event.key === 'ArrowRight' && direction.x !== -1) nextDir = { x:  1, y:  0 };
      event.preventDefault();
    });

    drawBackground();
    // ── Touch / swipe controls for mobile ──
let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  if (!isRunning) { startGame(); return; }

  // Figure out which direction the swipe went
  if (Math.abs(dx) > Math.abs(dy)) {
    // Horizontal swipe
    if (dx > 20  && direction.x !== -1) nextDir = { x: 1,  y: 0 };
    if (dx < -20 && direction.x !== 1)  nextDir = { x: -1, y: 0 };
  } else {
    // Vertical swipe
    if (dy > 20  && direction.y !== -1) nextDir = { x: 0, y: 1  };
    if (dy < -20 && direction.y !== 1)  nextDir = { x: 0, y: -1 };
  }

  e.preventDefault();
}, { passive: false });
  </script>

</body>
</html>
